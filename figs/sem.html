<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CD-SEM</title></head><body>
<script src="core.js"></script>
<script src="cf-kit.js"></script>
<script>
/* CD-SEM（量線寬用的掃描式電子顯微鏡）
   x = 深度（前面在 x = 110，裝載埠與晶圓盒再往前），y = 寬度（+y 在預設視角的左手邊），z = 高度；1 單位 ≈ 1 cm。
   真實流程（每一步之後晶圓在哪裡）：
   1. 放入晶圓：裝載埠打開晶圓盒（FOUP）的門 → 傳送手臂伸進盒子取最下面一片 → 退回真空預備室 → 外門關 →
      乾式真空泵把預備室從一大氣壓（10^5 Pa）抽到約 10^-3 Pa → 閘閥打開 → 手臂把晶圓送到腔體、頂針接手、
      手臂退出、頂針降下，晶圓落在靜電吸盤上 → 閘閥關。
   2. 移到量測點：XY 載台把要量的晶粒送到電子束正下方；兩組雷射干涉儀一直量載台位置。
   3. 掃描量線寬：電子槍放出電子（落到晶圓上只剩約 0.8 keV，免得打壞光阻、表面充電）→ 聚光透鏡、光圈 →
      兩組掃描線圈讓電子束一行一行掃 → 物鏡把束聚到約 1 nm → 打出的二次電子被鏡筒裡的偵測器收集 →
      螢幕一點一點拼出影像 → 演算法從亮邊算出線寬。
   4. 取出晶圓：反過來走一次，預備室先通大氣才開外門。
   零件（每個都固定在另一個零件上）：
   機殼     機殼本體 . 4 個調平腳 . 前面板（通風孔、緊急停止鈕、銘牌）. 背面維修門 . 高壓電纜入口
   鏡筒     法蘭（含螺栓）. 偵測器段 . 光電倍增管外殼 . 掃描段 . 聚光透鏡段 . 電子槍段 . 高壓絕緣頭 . 高壓電纜 .
            離子泵（本體、兩片磁鐵、接管）
            內部：燈絲座 . 發射尖端 . 引出電極 . 聚光透鏡線圈 . 光圈 . 兩組掃描線圈 . 閃爍體 . 光導 . 光電倍增管 .
            物鏡線圈 . 物鏡頂板 . 極靴
   腔體     腔體壁 . 兩條 X 導軌 . X 滑台 . 兩條 Y 導軌 . Y 滑台 . 兩根量測鏡 . 靜電吸盤 . 三根頂針 . 晶圓 .
            兩個雷射頭 . 渦輪分子泵（本體、法蘭）. 兩根框架樑 . 四根支柱 . 四個防震座
   傳送     裝載埠（面板、指示燈、承載台、支架）. 晶圓盒（7 片晶圓、頂部吊耳、兩側把手）. 真空預備室 . 外門與門座 .
            閘閥（閥板、閥殼）. 傳送手臂（轉軸座、伸縮臂、叉）
   真空     乾式真空泵 . 腔體前級管 . 預備室抽氣管
   電       高壓電源 . 控制電路插箱與 4 片電路板 . 機殼內的高壓電纜
   操作台   櫃體 . 桌面 . 鍵盤 . 螢幕支架 . 螢幕（狀態、SEM 影像）. 狀態燈塔（綠、黃、紅） */

const CAB = { x1:110, y1:100, z0:8, z1:112 };
const CABP = rrUV(0, CAB.z0, CAB.y1, CAB.z1, 5);
const AX = [38, 50];                                   // 鏡筒軸（x, y）
const CHB = { x0:6, x1:70, y0:10, y1:90, z0:76, z1:110 };
const LLB = { x0:72, x1:108, y0:30, y1:70, z0:82, z1:100 };
const FP = { x0:117, x1:150, y0:31, y1:69, z0:88, z1:121 };
const WR = 15, FOUP_X = 133.5, LOCK_X = 90, LOADP = [52, 50], MEAS = [42, 44];
const FORK_Z = [90.95, 91.45], WAF_FORK = 91.5, CHUCK_TOP = 90.5;
// 點標籤跳出的說明
window.CF_DESC = {
  '電子槍': '尖端在強電場下放出電子。CD-SEM 多用熱場發射槍，電流穩，一天量上千個點也不飄。',
  '聚光透鏡': '線圈的磁場把電子束收細。收得越細解析度越好，但電子越少、影像越多雜訊。',
  '掃描線圈': '兩組線圈讓電子束左右、上下偏轉，像老電視一樣一行一行掃過約 1 µm 見方的一小塊。',
  '二次電子偵測器': '電子打到表面會撞出能量很低的二次電子；邊緣跑出來的特別多，所以線條的邊在影像上是亮的。',
  '物鏡': '最後一道透鏡，把電子束聚到晶圓表面約 1 nm 的一點，決定解析度。',
  '晶圓': '量的是曝光或蝕刻後的線條。電子只用約 0.8 keV：能量太高會把光阻打縮，表面也會充電。',
  'XY 載台': '在真空裡把要量的晶粒送到電子束正下方，再用影像比對找到要量的那一條線。',
  '雷射干涉儀': '用雷射光的干涉量載台位置，解析度在奈米以下，載台跑到哪裡都知道。',
  '渦輪分子泵': '高速旋轉的葉片把氣體分子打出去，讓腔體維持高真空；電子撞到空氣分子就會散掉。',
  '真空預備室': '晶圓進出的緩衝室：在這裡先抽真空再開閘閥，主腔體不必每次都通大氣，換片快很多。',
  '閘閥': '隔開預備室和主腔體的門，兩邊都是真空時才打開。',
  '傳送手臂': '搬晶圓的機械手臂：從晶圓盒取片、經過預備室、送上載台，量完再送回去。',
  '乾式真空泵': '先把預備室從一大氣壓抽到低真空；不用油，免得油氣汙染晶圓。',
  '電子光學鏡筒': '電子槍、透鏡、掃描線圈、偵測器都在這根鏡筒裡，內部保持高真空。',
  '晶圓盒 FOUP': '前開式晶圓盒，一盒最多 25 片。廠內由天車搬運，晶圓不直接碰到無塵室的空氣。',
  '裝載埠': '放晶圓盒的平台：自動打開盒門，並掃描盒子裡哪幾格有晶圓。',
  '操作螢幕': '顯示 SEM 影像和量到的線寬。量產時機台自動照配方（recipe）跑，工程師多半只看結果和趨勢。',
  '狀態燈': '綠燈：正在動作；黃燈：待機或暫停；紅燈：異常停機。走道上遠遠就看得到。',
  '緊急停止鈕': '真的按下去整台會斷電停機，這裡不示範。' };
const STEEL = { l:'#e3e7ea', m:'#b9c0c5', d:'#838c92' }, GREYM = matOf('#aab3bb'), CHUCKM = matOf('#8d96a0');
const MIRRORM = { l:'#f4f7fb', m:'#cfd9e6', d:'#9fb0c4' }, WAFERM = { l:'#cdc6ea', m:'#a39bcd', d:'#625b8a' };
const COPPER = { l:'#f0b07a', m:'#d08a52', d:'#9a5a2c' }, PCBM = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' };
const FOUPM = matOf('#cdd6de'), CONSM = matOf('#ece9e0'), LPM = matOf('#d5dade'), REDM = matOf('#e2483d');
const GEARM = { l:'#7c8389', m:'#5c6369', d:'#3b4146' }, IRONM = matOf('#7a838c'), SCINT = matOf('#a8e6c8');
const HOT = '#ff9a3a';

/* ---------- 小零件 ---------- */
function waferSvg(cx, cy, z){
  const top = z + .4;
  let s = cyl(cx, cy, z, top, WR, WAFERM, toneI, .9, 40), g = '';
  for (let d = -12.6; d <= 12.7; d += 3.6){ const h = Math.sqrt(WR*WR - d*d) - .6;
    g += pd([[cx + d, cy - h, top + .02], [cx + d, cy + h, top + .02]], false) + pd([[cx - h, cy + d, top + .02], [cx + h, cy + d, top + .02]], false); }
  return s + `<path d="${g}" fill="none" stroke="#6f67a3" stroke-width=".45" opacity=".8"/>`;
}
const waferItem = (cx, cy, z) => ({ box:[[cx - WR, cy - WR, z], [cx + WR, cy + WR, z + .4]], svg: waferSvg(cx, cy, z) });
const disc = (cx, cy, z0, z1, r, M, hole = .8) => cyl(cx, cy, z0, z1, r, M, toneI, .6, 28) + fill(pd(on(PZ(z1 + .03), ellUV(cx, cy, hole, hole, 12))), '#1d1a16');
const wafZ = st => st.on === 'fork' ? WAF_FORK : st.on === 'chuck' ? CHUCK_TOP + st.pins : WAF_FORK;
const wafXY = st => st.on === 'chuck' ? st.stage : st.on === 'fork' ? [st.wx, 50] : [FOUP_X, 50];

// 傳送手臂的叉與伸縮臂，只畫 xa..xb 這一段（跨過不同腔體時分段畫，才能和各自的牆排前後）
function forkParts(st, xa, xb){
  const out = [], fc = st.fork;
  const seg = (x0, x1, y0, y1, z0, z1, M) => { const a = Math.max(x0, xa), b = Math.min(x1, xb);
    if (b - a > .05) out.push({ box:[[a, y0, z0], [b, y1, z1]], svg: box(a, y0, z0, b, y1, z1, M, toneI, .6) }); };
  if (Math.abs(fc - LOCK_X) > .5) seg(Math.min(LOCK_X, fc), Math.max(LOCK_X, fc), 48, 52, 90.95, 91.4, STEEL);
  seg(fc - 11, fc + 11, 43, 46, FORK_Z[0], FORK_Z[1], GEARM);
  seg(fc - 11, fc + 11, 54, 57, FORK_Z[0], FORK_Z[1], GEARM);
  seg(fc - 3, fc + 3, 46, 54, FORK_Z[0], FORK_Z[1], GEARM);
  return out;
}

/* ---------- 腔體裡：XY 載台、吸盤、頂針、晶圓、物鏡 ---------- */
function stageParts(st){
  const [sx, sy] = st.stage, out = [], put = (b, svg) => out.push({ box:b, svg });
  const bx = (x0, y0, z0, x1, y1, z1, M, w = .7) => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, M, toneI, w));
  for (const y of [18, 78]) bx(10, y, 76, 66, y + 4, 78, STEEL);                 // X 導軌，鎖在腔體底板
  bx(sx - 14, 16, 78, sx + 14, 84, 81.5, GREYM);                                  // X 滑台
  for (const dx of [-11, 9]) bx(sx + dx, 18, 81.5, sx + dx + 2, 82, 82.5, STEEL);  // Y 導軌
  bx(sx - 17, sy - 17, 82.5, sx + 17, sy + 17, 85.5, GREYM);                      // Y 滑台
  bx(sx - 17.6, sy - 15, 85.5, sx - 17, sy + 15, 88.5, MIRRORM, .5);              // X 量測鏡
  bx(sx - 15, sy + 17, 85.5, sx + 15, sy + 17.6, 88.5, MIRRORM, .5);              // Y 量測鏡
  put([[sx - 15.5, sy - 15.5, 85.5], [sx + 15.5, sy + 15.5, CHUCK_TOP]], cyl(sx, sy, 85.5, CHUCK_TOP, 15.5, CHUCKM, toneI, .9, 40)
    + `<path d="${pd(on(PZ(CHUCK_TOP + .02), ellUV(sx, sy, 11, 11, 32)))}" fill="none" stroke="${CHUCKM.d}" stroke-width=".5"/>`);
  if (st.pins > .01) for (const [dx, dy] of [[-9, 0], [9, 0], [0, -9]])
    put([[sx + dx - .5, sy + dy - .5, CHUCK_TOP], [sx + dx + .5, sy + dy + .5, CHUCK_TOP + st.pins]], rod([sx + dx, sy + dy, CHUCK_TOP], [sx + dx, sy + dy, CHUCK_TOP + st.pins], .45, STEEL, toneI, .5));
  return out;
}
function objectiveParts(){
  const [x, y] = AX, out = [];
  out.push({ box:[[x - 5.5, y - 5.5, 93.6], [x + 5.5, y + 5.5, 99]], svg: rod([x, y, 99], [x, y, 93.6], 5.5, STEEL, toneI, .8, 2.2) });   // 極靴
  out.push({ box:[[x - 13, y - 13, 99], [x + 13, y + 13, 107.6]], svg: cfCoil(x, y, 99, 107.6, 13, COPPER, 3) });
  out.push({ box:[[x - 15, y - 15, 107.6], [x + 15, y + 15, 110]], svg: disc(x, y, 107.6, 110, 15, IRONM, 3) });
  return out;
}

/* ---------- 電子束、二次電子、雷射 ---------- */
const BEAMW = [[169.5, .15], [166, .7], [158, 1.6], [150, 1.1], [140.3, .4], [136, .55], [124, .8], [108, 1.0], [99, .7], [93.6, .25], [CHUCK_TOP + .4, .04]];
function spotOf(st){
  const rows = 8, r = Math.min(rows - 1, Math.floor(st.scan * rows)), u = st.scan * rows - r;
  return [AX[0] + (r / (rows - 1) - .5) * 3.2, AX[1] - (Math.min(1, u) - .5) * 5, CHUCK_TOP + .4];
}
function beamSvg(st, zLo, zHi){
  if (st.beam < .01) return '';
  const sp = spotOf(st), piv = 133;
  const ctr = z => z >= piv ? AX : [AX[0] + (sp[0] - AX[0]) * (piv - z) / (piv - sp[2]), AX[1] + (sp[1] - AX[1]) * (piv - z) / (piv - sp[2])];
  const wAt = z => { for (let i = 0; i < BEAMW.length - 1; i++){ const [za, wa] = BEAMW[i], [zb, wb] = BEAMW[i + 1]; if (z <= za && z >= zb) return wa + (wb - wa) * (za - z) / (za - zb); } return .05; };
  const zs = []; for (let z = zHi; z > zLo; z -= .8) zs.push(z); zs.push(zLo);
  const Lp = [], Rp = [], core = [];
  for (const z of zs){ const [cx, cy] = ctr(z), q = P(cx, cy, z), w = wAt(z) * CAM_K; Lp.push([q[0] - w, q[1]]); Rp.push([q[0] + w, q[1]]); core.push(q); }
  const poly = 'M' + [...Lp, ...Rp.reverse()].map(p => f(p[0]) + ' ' + f(p[1])).join('L') + 'Z';
  let s = `<path d="${poly}" fill="#5b8cff" opacity="${f(.45 * st.beam)}"/><path d="M${core.map(q => f(q[0]) + ' ' + f(q[1])).join('L')}" fill="none" stroke="#2457d6" stroke-width="1" opacity="${f(st.beam)}"/>`;
  if (zLo <= sp[2] + .1){ const q = P(...sp); s += `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(2.4)}" fill="#bcd4ff" opacity="${f(.85 * st.beam)}"/><circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(.9)}" fill="#ffffff" opacity="${f(st.beam)}"/>`; }
  return s;
}
function seDots(st, zLo, zHi){
  if (!(st.scan > 0 && st.scan < 1) || st.beam < .5) return '';
  const sp = spotOf(st), t = cfNow(st) / 1000, det = [AX[0], AX[1] + 5, 118.2];
  let s = '';
  for (let i = 0; i < 10; i++){
    const u = (t * .9 + i / 10) % 1;
    let p;
    if (u < .8){ const a = u / .8, wob = 1.4 * (1 - a);
      p = [sp[0] + (AX[0] - sp[0]) * a + Math.sin(a * 9 + i) * wob, sp[1] + (AX[1] - sp[1]) * a + Math.cos(a * 9 + i) * wob, sp[2] + (det[2] - sp[2]) * a]; }
    else { const a = (u - .8) / .2; p = [AX[0], AX[1] + (det[1] - AX[1]) * a, det[2]]; }
    if (p[2] < zLo || p[2] > zHi) continue;
    const q = P(...p); s += `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="1.1" fill="#f2b33d" stroke="${INK}" stroke-width=".4"/>`;
  }
  return s;
}
function laserSvg(st){
  if (st.on !== 'chuck' || st.las < .05) return '';
  const [sx, sy] = st.stage, d = (a, b) => `<path d="${pd([a, b], false)}" fill="none" stroke="#e2483d" stroke-width="1" stroke-dasharray="2 1.5" opacity="${f(.35 + .6 * st.las)}"/>`;
  return d([6, 45, 87], [sx - 17.6, 45, 87]) + d([40, 90, 87], [40, sy + 17.6, 87]);
}

/* ---------- 機殼裡（透視時才畫） ---------- */
function chamberGroup(st){
  const parts = [...stageParts(st), ...objectiveParts(), ...forkParts(st, -1e9, CHB.x1)];
  const [wx, wy] = wafXY(st);
  if (st.on === 'chuck' || (st.on === 'fork' && st.wx < CHB.x1 + 1)) parts.push(waferItem(wx, wy, wafZ(st)));
  return cfShell(CHB.x0, CHB.y0, CHB.z0, CHB.x1, CHB.y1, CHB.z1, '#9aa6b0', cfDepth(parts))
    + laserSvg(st) + beamSvg(st, CHUCK_TOP + .4, 112) + seDots(st, CHUCK_TOP, 112);
}
function lockGroup(st){
  const parts = [...forkParts(st, LLB.x0, LLB.x1)];
  parts.push({ box:[[LOCK_X - 4.5, 45.5, LLB.z0], [LOCK_X + 4.5, 54.5, 90.95]], svg: cyl(LOCK_X, 50, LLB.z0, 90.95, 4.5, GEARM, toneI, .8, 20) });   // 手臂轉軸座
  if (st.on === 'fork' && st.wx >= CHB.x1 + 1 && st.wx <= 109) parts.push(waferItem(st.wx, 50, WAF_FORK));
  const dz = 13 * st.door, z0 = Math.max(LLB.z0, 85 - dz), z1 = 97.5 - dz;   // 外門往下滑進門座
  if (z1 - z0 > .3) parts.push({ box:[[106.4, 33, z0], [107.8, 67, z1]], svg: box(106.4, 33, z0, 107.8, 67, z1, STEEL, toneI, .7) });
  return cfShell(LLB.x0, LLB.y0, LLB.z0, LLB.x1, LLB.y1, LLB.z1, '#9aa6b0', cfDepth(parts));
}
function cabInside(st){
  const items = [], put = (b, svg) => items.push({ box:b, svg });
  const bx = (x0, y0, z0, x1, y1, z1, M, w = .8, extra = '') => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, M, toneI, w) + extra);
  const pumping = (st.phase === 'load' && st.t > 2.3 && st.t < 3.35) || (st.phase === 'unload' && st.t > 2.2 && st.t < 3.0);
  put([[CHB.x0, CHB.y0, CHB.z0], [CHB.x1, CHB.y1, CHB.z1]], chamberGroup(st));
  put([[LLB.x0, LLB.y0, LLB.z0], [LLB.x1, LLB.y1, LLB.z1]], lockGroup(st));
  // 閘閥：閥板往上收進閥殼
  const gz = 12 * st.gate;
  put([[CHB.x1, 30, 85], [LLB.x0, 70, CHB.z1]], box(70.3, 32, 85 + gz, 71.7, 68, 98 + gz, STEEL, toneI, .7) + box(CHB.x1, 30, 100.5, LLB.x0, 70, CHB.z1, GEARM, toneI, .8));
  bx(105.5, 31, 72, 109, 69, LLB.z0, GEARM);                                                         // 外門門座
  // 渦輪分子泵（掛在腔體底下）＋前級管、乾式真空泵、預備室抽氣管
  put([[AX[0] - 12.5, AX[1] - 12.5, 52], [AX[0] + 12.5, AX[1] + 12.5, CHB.z0]], cyl(AX[0], AX[1], 52, 72, 10, STEEL, toneI, .9, 32) + cyl(AX[0], AX[1], 72, CHB.z0, 12.5, GEARM, toneI, .9, 32));
  bx(74, 60, 10, 104, 94, 34, matOf('#7f9bb5'), 1, facing([1, 0, 0]) ? [16, 20, 24, 28].map(z => line([[104.05, 64, z], [104.05, 90, z]], .5)).join('') : '');
  items.push(...cfWire([[AX[0], AX[1] + 10, 56], [AX[0], 70, 56], [60, 74, 42], [80, 74, 34]], '#8d949a', .9));
  items.push(...cfWire([[98, 62, LLB.z0], [98, 62, 62], [98, 72, 44], [98, 72, 34]], pumping ? HOT : '#8d949a', .9));
  // 框架、支柱、防震座
  for (const y of [12, 82]) bx(8, y, 64, 68, y + 6, 70, GEARM);
  for (const [x, y] of [[8, 12], [65, 12], [8, 85], [65, 85]]) bx(x, y, CAB.z0, x + 3, y + 3, 64, GEARM, .7);

    } },
  move: { T: 1.3, cues: [[0, '載台把要量的晶粒送到電子束正下方；雷射干涉儀盯著位置，解析度在奈米以下']],
    at(st, t){ const k = sem(t, 0, 1.2); st.stage = [cfLerp(st.s0[0], MEAS[0], k), cfLerp(st.s0[1], MEAS[1], k)]; st.las = 1; } },
  home: { T: .95, cues: [[0, '載台先退回交接晶圓的位置']], at(st, t){ const k = sem(t, 0, .9); st.stage = [cfLerp(st.s0[0], LOADP[0], k), cfLerp(st.s0[1], LOADP[1], k)]; st.las = 1; } },
  scan: { T: 3.9, cues: [[0, '電子束一行一行掃過表面，打出的二次電子被偵測器收集，螢幕一點一點拼出影像'], [3.35, '演算法從亮邊判定兩個邊，算出線寬']],
    at(st, t){ st.beam = sem(t, 0, .3) * (1 - sem(t, 3.5, 3.8)); st.scan = Math.max(0, Math.min(1, (t - .35) / 3)); st.img = st.scan;
      if (t > 3.35 && st.cd == null) st.cd = 21.6 + Math.random() * .8; } },
};
let ui, pauser, loopOn = false;
function loop(){   // 時鐘：暫停時停下，按「繼續」再叫一次
  if (loopOn) return; loopOn = true;
  ui.animate(dt => { const s = ui.st;
    if (s.phase === 'idle' || s.paused){ loopOn = false; return false; }
    const ph = PH[s.phase]; s.t += dt; ph.at(s, Math.min(s.t, ph.T));
    (ph.cues || []).forEach(([ct, msg], i) => { if (s.t >= ct && s.said < i){ s.said = i; s.cue = msg; ui.flash(msg, 2800); } });
    if (s.t >= ph.T){ const nx = s.next; s.phase = 'idle'; s.las = s.on === 'chuck' ? .35 : 0; if (nx) run(nx); }
    return true; });
}
function run(name, then){
  const st = ui.st; st.phase = name; st.t = 0; st.next = then || null; st.s0 = st.stage.slice(); st.said = -1; st.cue = '';
  if (name === 'scan'){ st.cd = null; st.img = 0; st.scan = 0; }
  loop();
}
const near = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]) < .3;
const busyNote = () => pauser.busy();
function doLoad(st){ if (st.phase !== 'idle') return busyNote(); if (st.on === 'chuck') return ui.flash('晶圓已經在腔體裡了'); st.stage = LOADP.slice(); run('load'); }
function doMove(st){ if (st.phase !== 'idle') return busyNote(); if (st.on !== 'chuck') return ui.flash('腔體裡還沒有晶圓：先按「放入晶圓」'); if (near(st.stage, MEAS)) return ui.flash('已經在量測點上了'); run('move'); }
function doScan(st){ if (st.phase !== 'idle') return busyNote(); if (st.on !== 'chuck') return ui.flash('腔體裡還沒有晶圓：先按「放入晶圓」'); if (!near(st.stage, MEAS)) return run('move', 'scan'); run('scan'); }
function doUnload(st){ if (st.phase !== 'idle') return busyNote(); if (st.on === 'foup') return ui.flash('晶圓已經在晶圓盒裡了'); if (!near(st.stage, LOADP)) return run('home', 'unload'); run('unload'); }
const fmtP = e => { const n = Math.round(e); return `10<sup style="font-size:.52em;margin-left:1px">${n < 0 ? '−' + -n : n}</sup> Pa`; };

ui = mountFigure({
  fig:'SEM', turn:'full', title:'CD-SEM', credit:false,
  size:[150, 140, 192], center:[74, 70], palette:'cobalt',
  state:{ phase:'idle', t:0, paused:false, pauseAt:0, cue:'', on:'foup', wx:FOUP_X, fork:LOCK_X, door:0, gate:0, pins:0, lockP:5, stage:LOADP.slice(), s0:LOADP.slice(), beam:0, scan:0, img:0, cd:null, las:0, said:-1, next:null },
  scene,
  stats: st => [ { label:'預備室氣壓', value: fmtP(st.lockP) }, { label:'量到線寬', value: st.cd == null ? '—' : st.cd.toFixed(1) + ' nm' } ],
  buttons:[
    { label:'放入晶圓', onClick: doLoad },
    { label:'移到量測點', onClick: doMove },
    { label:'掃描量線寬', onClick: doScan },
    { label:'取出晶圓', onClick: doUnload },
    { label:'暫停', onClick: () => pauser.toggle() },
  ],
  acts:{ emo: () => cfNote(ui, '【緊急停止鈕】' + CF_DESC['緊急停止鈕']), screen: st => doScan(st), tag: cfTagAct },
  params:(st, q) => {
    if (q.get('wafer') === 'chuck'){ st.on = 'chuck'; st.lockP = -3; st.las = .35; }
    if (q.get('at') === 'meas') st.stage = MEAS.slice();
    for (const key of ['beam', 'scan', 'door', 'gate', 'pins', 'fork', 'las', 'lockP']) if (q.has(key)) st[key] = +q.get(key);
    if (q.has('scan')) st.img = st.scan;
    if (q.has('cd')) st.cd = +q.get('cd');
    if (q.get('wafer') === 'fork'){ st.on = 'fork'; st.wx = st.fork; }
  },
});
xrMount(() => ui, () => '');
pauser = cfPause(ui, loop);
</script></body></html>
